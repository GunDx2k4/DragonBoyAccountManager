name: Release & Publish Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name / Version (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
        type: string
      draft:
        description: 'Create Draft Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Exe (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: ver
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name }}"
          if (-not $rawTag) {
            $rawTag = "${{ github.ref_name }}"
          }
          if (-not $rawTag -or $rawTag -eq "main") {
            $rawTag = "v1.0.0"
          }
          $cleanVersion = $rawTag.TrimStart('v').TrimStart('V')
          echo "tag=$rawTag" >> $env:GITHUB_OUTPUT
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Tag: $rawTag"
          Write-Host "Resolved Version: $cleanVersion"

      - name: Restore dependencies
        run: dotnet restore DBAM.slnx

      - name: Publish CLI (Single-File)
        run: |
          dotnet publish src/DragonBoyAccountManager.CLI/DragonBoyAccountManager.CLI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:FileVersion=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} `
            -o ./publish/cli

      - name: Publish GUI (Single-File)
        run: |
          dotnet publish src/DragonBoyAccountManager.GUI/DragonBoyAccountManager.GUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:FileVersion=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} `
            -o ./publish/gui

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish/release
          Copy-Item ./publish/cli/DragonBoyAccountManager.CLI.exe ./publish/release/DragonBoyAccountManager-CLI.exe
          Copy-Item ./publish/gui/DragonBoyAccountManager.GUI.exe ./publish/release/DragonBoyAccountManager-GUI.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBAM-win-x64-${{ steps.ver.outputs.version }}
          path: ./publish/release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DragonBoy Account Manager ${{ steps.ver.outputs.tag }}
          files: |
            ./publish/release/DragonBoyAccountManager-GUI.exe
            ./publish/release/DragonBoyAccountManager-CLI.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
