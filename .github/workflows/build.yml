name: Build & Verify (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Single-File Executables (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DBAM.slnx

      - name: Publish CLI (Single-File)
        run: dotnet publish src/DragonBoyAccountManager.CLI/DragonBoyAccountManager.CLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish/cli

      - name: Publish GUI (Single-File)
        run: dotnet publish src/DragonBoyAccountManager.GUI/DragonBoyAccountManager.GUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/gui

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish/release
          Copy-Item ./publish/cli/DragonBoyAccountManager.CLI.exe ./publish/release/DragonBoyAccountManager-CLI.exe
          Copy-Item ./publish/gui/DragonBoyAccountManager.GUI.exe ./publish/release/DragonBoyAccountManager-GUI.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBAM-win-x64-CI
          path: ./publish/release/*.exe
          if-no-files-found: error
